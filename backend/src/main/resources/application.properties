spring.application.name=library

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/library}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:library}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:library}

# No Flyway: Hibernate creates/updates the tables from the entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

openlibrary.base-url=${OPENLIBRARY_BASE_URL:https://openlibrary.org}
